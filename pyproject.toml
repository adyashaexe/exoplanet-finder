[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet-finder"
version = "0.1.0"
description = "Find exoplanet transits in stellar light curves: BLS search, a two-branch 1D CNN classifier, a FastAPI backend and a dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "astropy>=6.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.26",
  "tqdm>=4.66",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
data = ["lightkurve>=2.4"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = ["torch>=2.1", "lightkurve>=2.4", "pytest>=8.0", "ruff>=0.4"]

[project.scripts]
exofinder = "exofinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exofinder = ["api/static/*", "api/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
